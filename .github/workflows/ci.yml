name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Keep in sync with rust-toolchain.toml: new clippy lints land with each release.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Linux GUI libraries (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev
      # The app embeds ui/dist at compile time, so build the UI first.
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p wakeup-spike

  # Unsigned (ad-hoc) app for dogfooding. Download it from the run's artifacts.
  app-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: ui/node_modules/.bin/tauri build --bundles app
      # upload-artifact drops executable bits, so zip with ditto first.
      - run: ditto -c -k --keepParent target/release/bundle/macos/wakeup.app wakeup-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wakeup-macos
          path: wakeup-macos.zip
          retention-days: 14
